# CI (docs/infra.md, P0-I4): secret scan → lint, types, unit tests, build → integration tests
# (Postgres, Valkey, local S3; then storage off) → the four images built and smoke-tested → Playwright
# end to end on pull requests to main (and 6.0 for now). Services come from the same compose file as local dev.
name: CI

on:
  push:
    # `6.0` until the repo migration puts 6.0 on main (docs/repo-migration.md).
    branches: [main, '6.0']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  # The dev compose's services, on the ports .env.example uses.
  COMPOSE: docker compose -f docker/compose.dev.yml --env-file .env

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Only this branch's history: the repository also holds Socioboard 5.0's branches, which
      # aren't this code (and are scanned separately, not on every push).
      - name: Scan the history for secrets
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --log-opts=HEAD --redact --no-banner --exit-code 1

  dco:
    name: Sign-off (DCO)
    # Outside contributions (pull requests from forks) must be signed off (CONTRIBUTING.md).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/check-dco.sh "$BASE" "$HEAD"

  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Format, lint, dependency rules, types
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Component catalog
        run: pnpm --filter @socioboard/ui catalog:build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      # The Prisma client is generated, not committed; `pnpm check` and `pnpm build` generate it
      # through turbo, but these jobs run tests straight away.
      - name: Generate the database client
        run: pnpm generate
      - name: Start Postgres, Valkey, Mailpit, local S3
        run: COMPOSE_PROFILES=local-s3 $COMPOSE up -d --wait
      - name: Migrate
        run: pnpm --filter @socioboard/db migrate:deploy
      # The local S3 (RustFS in the dev compose) is the tests' default storage
      # (packages/core/vitest.setup.ts); an empty S3_BUCKET turns storage off.
      - name: Integration tests, against the local S3
        run: pnpm --filter @socioboard/core test:int
      - name: Integration tests, storage off
        env:
          S3_BUCKET: ''
        run: pnpm --filter @socioboard/core test:int
      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --tail 200

  images:
    name: Images and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # amd64 here; the release workflow (P5-I5) builds multi-arch and pushes to GHCR.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: socioboard-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          tags: socioboard-worker:ci
          load: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Build the migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/db/Dockerfile
          tags: socioboard-migrate:ci
          load: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: socioboard-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - run: cp .env.example .env
      - name: Start Postgres and Valkey
        run: $COMPOSE up -d --wait postgres valkey mailpit
      - name: Smoke test (health, worker start, web routes, graceful SIGTERM)
        run: bash docker/smoke-test.sh

  chaos:
    name: Restarts (chaos)
    # P2-Q1: kills the api, the worker and Valkey around scheduled times and counts every send
    # (tests/chaos). About 5 minutes, so with the browser tests: pull requests and on demand.
    if: >-
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'main' || github.base_ref == '6.0')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Generate the database client
        run: pnpm generate
      # Postgres from the dev compose; the suite starts its own Valkey, which it kills.
      - name: Start Postgres, Valkey, Mailpit
        run: $COMPOSE up -d --wait
      - name: Migrate
        run: pnpm --filter @socioboard/db migrate:deploy
      - name: Restart tests
        run: pnpm test:chaos
      - name: Ledger and process logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-run
          path: /tmp/sb-chaos-*
          retention-days: 7

  e2e:
    name: End to end (Playwright)
    # On pull requests to main (docs/infra.md), and to `6.0` until the repo migration puts 6.0 on
    # main; and on demand.
    if: >-
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'main' || github.base_ref == '6.0')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      # The Prisma client is generated, not committed; `pnpm check` and `pnpm build` generate it
      # through turbo, but these jobs run tests straight away.
      - name: Generate the database client
        run: pnpm generate
      - name: Start Postgres, Valkey, Mailpit, local S3
        run: COMPOSE_PROFILES=local-s3 $COMPOSE up -d --wait
      - name: Migrate
        run: pnpm --filter @socioboard/db migrate:deploy
      - name: Install Chromium
        run: pnpm --filter @socioboard/web exec playwright install --with-deps chromium
      # The app suite only; the Meta suite publishes to real accounts and never runs in CI.
      - name: End-to-end tests
        run: pnpm --filter @socioboard/web e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
