# Staging: app-dev.socioboard.ai (docs/infra.md#staging-pm2, P0-I7). One domain for the app and
# its API, so the session cookie stays first-party and the networks' login redirects
# (/api/oauth/<network>/callback) and media links (/public-media/) are on it.
# TLS (certificate lines, the port 80 redirect) is left to DevOps' usual setup.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl;
  http2 on;
  server_name app-dev.socioboard.ai;

  # Files go straight to storage from the browser; API bodies are capped at 1 MB by the app.
  client_max_body_size 10m;

  # The API, including live updates (WebSockets on /api/socket.io).
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Browser uploads with NAS storage (docs/backend/modules/media.md#nas-storage): files in one
  # request up to 16 MB, larger ones in 16 MB parts, so bodies are bigger than the API's.
  location /api/storage/upload/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Signed, expiring links that Instagram, TikTok and Pinterest download media from.
  location /public-media/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # Everything else: the web app (PM2 serves apps/web/dist on 3001, app routes → index.html).
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
  }
}
