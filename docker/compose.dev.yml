# Local services for development. The apps (api, worker, web) run on the
# host with `pnpm dev`. Media goes to Amazon S3 by default; without an S3
# account, set COMPOSE_PROFILES=minio in .env to run MinIO here instead.
# Host ports can be changed in .env if they clash with something else.
name: socioboard-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: socioboard
      POSTGRES_PASSWORD: socioboard
      POSTGRES_DB: socioboard
    ports:
      - '${POSTGRES_PORT:-5440}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U socioboard -d socioboard']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    # BullMQ needs noeviction: evicted keys would silently drop jobs.
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${VALKEY_PORT:-6380}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Optional: MinIO instead of Amazon S3 (COMPOSE_PROFILES=minio) ---
  # MinIO no longer publishes to Docker Hub; quay.io is its official registry.
  minio:
    profiles: [minio]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    environment:
      MINIO_ROOT_USER: socioboard
      MINIO_ROOT_PASSWORD: socioboard-dev-secret
      MC_HOST_local: http://socioboard:socioboard-dev-secret@localhost:9000
    # Starts the server, then creates the media bucket once it is ready.
    entrypoint:
      - sh
      - -c
      - |
        minio server /data --console-address :9001 &
        pid=$$!
        trap 'kill $$pid' TERM INT
        until mc ready local >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing local/socioboard-media
        wait $$pid
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ls local/socioboard-media >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  valkey-data:
  minio-data:
