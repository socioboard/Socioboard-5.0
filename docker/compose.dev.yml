# Local services for development. The apps (api, worker, web) run on the
# host with `pnpm dev`. Media goes to Amazon S3 by default; without an S3
# account, set COMPOSE_PROFILES=minio in .env to run a local S3 (RustFS) here instead.
# Host ports can be changed in .env if they clash with something else.
name: socioboard-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: socioboard
      POSTGRES_PASSWORD: socioboard
      POSTGRES_DB: socioboard
    ports:
      - '${POSTGRES_PORT:-5440}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U socioboard -d socioboard']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    # BullMQ needs noeviction: evicted keys would silently drop jobs.
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${VALKEY_PORT:-6380}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      # Mailpit rejects browser requests whose Origin isn't its own host:port. Some browsers and
      # extensions send a bare "localhost" or 127.0.0.1 origin, which broke the inbox page
      # ("Blocked due to CORS violation"). Local hostnames only, never "*".
      MP_API_CORS: 'localhost,127.0.0.1,127.0.0.1:${MAILPIT_UI_PORT:-8025}'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Optional: a local S3 instead of Amazon S3 (COMPOSE_PROFILES=minio) ---
  # MinIO stopped publishing its images in 2025, so the local S3 is RustFS, an S3-compatible
  # server built to replace MinIO (Apache-2.0). The profile keeps the name `minio` so existing
  # .env files keep working; `local-s3` works too. Same address, keys and bucket as before.
  s3:
    profiles: [minio, local-s3]
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: socioboard
      RUSTFS_SECRET_KEY: socioboard-dev-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - s3-data:/data
    # Healthy once it answers, the media bucket exists, and browsers may upload to it (CORS:
    # PUT/POST from any local origin, ETag exposed for multipart). Each step is safe to repeat,
    # so `docker compose up --wait` returns only when storage is ready to use.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:9000/health >/dev/null &&
          curl -s -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user socioboard:socioboard-dev-secret
          -X PUT http://localhost:9000/socioboard-media &&
          printf '%s' '<CORSConfiguration><CORSRule><AllowedOrigin>*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>POST</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3000</MaxAgeSeconds></CORSRule></CORSConfiguration>' |
          curl -sf -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user socioboard:socioboard-dev-secret
          -X PUT -H 'Content-Type: application/xml' --data-binary @- 'http://localhost:9000/socioboard-media?cors'
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  valkey-data:
  s3-data:
