# The web app's static files (apps/web/Dockerfile). Hashed assets are cached for a year;
# index.html never, so a new release is picked up at once.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
